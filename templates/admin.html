<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - Tab Tracker</title>
</head>
<body>
    <h1>Tracked Tabs</h1>
    <table border="1">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Title</th>
                <th>URL</th>
            </tr>
        </thead>
        <tbody id="tabsTableBody">
            <tr><td colspan="3">Loading...</td></tr>
        </tbody>
    </table>

    <script>
        async function loadTabs() {
            try {
                const response = await fetch('/get_tabs_data');
                const tabs = await response.json();

                const tableBody = document.getElementById('tabsTableBody');
                tableBody.innerHTML = '';

                if (tabs.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="3">No data found</td></tr>';
                    return;
                }

                tabs.forEach(tab => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${tab.timestamp}</td>
                        <td>${tab.title}</td>
                        <td><a href="${tab.url}" target="_blank">${tab.url}</a></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching tabs:', error);
                document.getElementById('tabsTableBody').innerHTML = '<tr><td colspan="3">Error loading data</td></tr>';
            }
        }

        loadTabs();
        setInterval(loadTabs, 5000);  
    </script>
</body>
</html>
